dataset: grbench
model_name: graph_llm
project: s2ge_grbench
llm_model_name: llama3_8b_instruct
llm_frozen: "False"
batch_size: 1
eval_batch_size: 1
grad_steps: 2
num_epochs: 1
patience: 1
max_txt_len: 256
max_new_tokens: 32
bf16: true
grad_checkpointing: true
use_deepspeed: true
gnn_model_name: vpa_aegf_gat_light
gnn_num_layers: 1
gnn_in_dim: 384
gnn_hidden_dim: 384
gnn_num_heads: 4
hsgs_enabled: true
hsgs_k_init: 25
hsgs_gamma: 0.7
hsgs_seed_budget: 8
graph_token_mode: nodes
graph_token_budget: 32
graph_projector_mode: llaga
llaga_projector_type: 2-layer-mlp
moco_enabled: false
dual_view_enabled: false
grbench_domain: dblp
grbench_desc_mode: none
grbench_desc_max_nodes: 200
grbench_embedding_model: sentence-transformers/all-MiniLM-L6-v2
grbench_cache_embeddings: true
