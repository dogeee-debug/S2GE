# EXPERIMENTAL DEVELOPMENT CONFIG: short monitor-enabled query-syntax variant.
# This is not a validated reproduction of the paper's no-query-aware sampler.
dataset: grbench
model_name: graph_llm
project: s2ge_dblp_experimental_query_syntax_variant
llm_model_name: llama3_8b_instruct
llm_frozen: "False"
lr: 8.0e-6
warmup_epochs: 2.0
batch_size: 1
eval_batch_size: 1
train_num_workers: 0
eval_num_workers: 0
persistent_workers: false
monitor_subset_enabled: true
monitor_subset_size: 16
monitor_every_optimizer_steps: 50
monitor_eval_batch_size: 1
monitor_subset_seed: 0
monitor_digit_min_length: 6
monitor_keep_predictions: false
monitor_save_best_checkpoint: false
monitor_best_digit8_threshold: 0.10
monitor_drives_axis_controller: false
grad_steps: 2
num_epochs: 4
patience: 4
max_txt_len: 128
max_new_tokens: 32
bf16: true
grad_checkpointing: false
use_deepspeed: true
gnn_model_name: vpa_aegf_gat_light
gnn_num_layers: 1
gnn_in_dim: 384
gnn_hidden_dim: 384
gnn_num_heads: 4
hsgs_enabled: true
hsgs_k_init: 16
hsgs_gamma: 0.7
hsgs_seed_budget: 4
hsgs_num_hops: 2
graph_token_mode: nodes
graph_token_budget: 32
graph_query_syntax_enabled: false
graph_token_shuffle_enabled: false
legal_integer_decode_enabled: true
legal_integer_min: 1
legal_integer_max: 5
graph_role_encoding_enabled: false
graph_role_post_projector_enabled: true
graph_distance_post_projector_enabled: true
graph_role_residual_gated_enabled: true
graph_role_residual_alpha_init: 0.1
graph_role_residual_layernorm_enabled: true
graph_role_residual_clip_ratio: 0.1
graph_distance_encoding_enabled: false
graph_distance_residual_bucket_count: 6
graph_distance_residual_role_conditioned_enabled: true
graph_distance_residual_alpha_init: 0.0
graph_distance_residual_clip_ratio: 0.1
distance_branch_freeze_epochs: 2
graph_corridor_alpha: 1.0
graph_projector_freeze_steps: 0
graph_projector_mode: llaga
llaga_projector_type: 2-layer-mlp
llaga_projector_ckpt: none
moco_enabled: false
dual_view_enabled: false
degree_bias_enabled: true
node_identity_enabled: true
align_lambda: 0.25
align_on_projected_tokens: true
dynamic_align_lambda_enabled: false
align_lr_compensation_enabled: false
axis_momentum_reset_enabled: false
grbench_domain: dblp_hopqa_train2000_val200_test1000
grbench_task_filter: hop
grbench_desc_mode: none
grbench_desc_max_nodes: 64
grbench_embedding_model: sentence-transformers/all-MiniLM-L6-v2
grbench_cache_embeddings: true
checkpoint_trainable_only: true
save_every_epoch: false
best_checkpoint_metric: val_em_digit8
best_checkpoint_digit8_threshold: 0.1
best_checkpoint_fallback_to_val_loss: false
epoch_diagnostics_enabled: true
epoch_diagnostics_digit_min_length: 6
skip_test: true
skip_checkpoint_optimizer: true
